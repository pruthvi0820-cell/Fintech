[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fin-agent"
version = "0.1.0"
description = "FinTray: personal FinTech research assistant for Indian stocks. Market data, indicators, checked AI explanations. Human-in-the-loop by design."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "yfinance>=0.2.40",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "feedparser>=6.0",
    "requests>=2.31",
    "openpyxl>=3.1",                     # reads screener.in Excel exports
    "pypdf>=4.0",                        # reads PDFs saved as notes
    "tzdata; sys_platform == 'win32'",   # zoneinfo needs this on Windows
]

[project.optional-dependencies]
dev = ["pytest>=8"]
app = ["streamlit>=1.65", "plotly>=5.20"]   # page: streamlit run scripts/app.py

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
